<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR: информационная карточка станка</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #hint, #info {
      position: fixed; left: 50%; transform: translateX(-50%);
      z-index: 10; padding: 10px 14px; border-radius: 10px;
      color: #fff; text-align: center; max-width: 90%;
    }
    #hint { top: 10px; background: rgba(0,0,0,.6); font-size: 14px; }
    #info { bottom: 15px; background: rgba(0,60,120,.85); font-size: 15px;
            text-align: left; display: none; line-height: 1.4; }
  </style>
</head>
<body>
  <div id="hint">Наведите камеру на маркер Hiro</div>
  <div id="info">
    <b>Токарный станок 16К20</b><br>
    Тип: универсальный токарно-винторезный<br>
    Макс. диаметр обработки: 400 мм<br>
    Мощность двигателя: 10 кВт<br>
    Статус: готов к работе
  </div>

  <a-scene embedded vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <a-marker preset="hiro" id="marker">
      <a-box position="0 0.15 0" width="1.6" height="0.3" depth="0.7" color="#455a64"></a-box>
      <a-box position="-0.6 0.55 0" width="0.4" height="0.5" depth="0.5" color="#1976d2"></a-box>
      <a-cylinder position="-0.25 0.6 0" rotation="0 0 90" radius="0.12" height="0.5" color="#b0bec5"
                  animation="property: rotation; to: 360 0 90; loop: true; dur: 2000; easing: linear"></a-cylinder>
      <a-box position="0.55 0.45 0" width="0.3" height="0.3" depth="0.3" color="#e53935"></a-box>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.getElementById('marker');
    const info = document.getElementById('info');
    const hint = document.getElementById('hint');
    marker.addEventListener('markerFound', () => {
      info.style.display = 'block';
      hint.style.display = 'none';
    });
    marker.addEventListener('markerLost', () => {
      info.style.display = 'none';
      hint.style.display = 'block';
    });
  </script>
</body>
</html>
